services:
  inference-api:
    build:
      context: .
      target: dev
    ports:
      - "5678:5678"
    environment:
      - PYDEVD_DISABLE_FILE_VALIDATION=1
    command: [ "python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "--wait-for-client", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    profiles: [ "debug" ]
